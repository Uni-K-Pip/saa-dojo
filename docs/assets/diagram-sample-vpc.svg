<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 548" width="360" height="548" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic UI', sans-serif">
  <title id="t">3 層の VPC（2 つの AZ）の見本</title>
  <desc id="d">VPC の中に 2 つの AZ があり、それぞれにパブリック、プライベート、分離の 3 つのサブネットがあります。パブリックサブネットには ALB と NAT ゲートウェイ、プライベートサブネットにはアプリケーションの EC2 インスタンス、分離されたサブネットには RDS があります。利用者のリクエストはインターネットゲートウェイから ALB に入り、アプリケーション、データベースのプライマリへ進みます。アプリケーションから外へ出る通信は、NAT ゲートウェイとインターネットゲートウェイを通ります。プライマリからスタンバイへは同期で複製します。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1f2933"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="360" height="548" fill="#ffffff"/>

  <!-- 入れ物: VPC、AZ、サブネット -->
  <rect x="6" y="92" width="348" height="340" rx="6" fill="none" stroke="#6b4fbb" stroke-width="2"/>
  <text x="14" y="107" font-size="11" font-weight="700" fill="#6b4fbb">VPC 10.0.0.0/16</text>

  <rect x="14" y="124" width="162" height="298" rx="4" fill="none" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="2 3"/>
  <text x="22" y="138" font-size="10.5" fill="#52606d">AZ-a</text>
  <rect x="184" y="124" width="162" height="298" rx="4" fill="none" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="2 3"/>
  <text x="314" y="138" font-size="10.5" fill="#52606d">AZ-c</text>

  <g stroke-width="1.2">
    <rect x="22" y="150" width="146" height="74" rx="4" fill="#eaf6ee" stroke="#3f8f5f"/>
    <rect x="22" y="244" width="146" height="74" rx="4" fill="#e8f1fb" stroke="#4a84c4"/>
    <rect x="22" y="338" width="146" height="74" rx="4" fill="#f0f1f3" stroke="#7b8794"/>
    <rect x="192" y="150" width="146" height="74" rx="4" fill="#eaf6ee" stroke="#3f8f5f"/>
    <rect x="192" y="244" width="146" height="74" rx="4" fill="#e8f1fb" stroke="#4a84c4"/>
    <rect x="192" y="338" width="146" height="74" rx="4" fill="#f0f1f3" stroke="#7b8794"/>
  </g>

  <!-- サブネットの種類の札（色だけに頼らず、語で示す） -->
  <g font-size="9.5" fill="#ffffff" text-anchor="middle">
    <rect x="66" y="143" width="58" height="14" rx="7" fill="#2f7d4f"/><text x="95" y="153.5">パブリック</text>
    <rect x="64" y="237" width="62" height="14" rx="7" fill="#2f69a8"/><text x="95" y="247.5">プライベート</text>
    <rect x="78" y="331" width="34" height="14" rx="7" fill="#5a6673"/><text x="95" y="341.5">分離</text>
    <rect x="236" y="143" width="58" height="14" rx="7" fill="#2f7d4f"/><text x="265" y="153.5">パブリック</text>
    <rect x="234" y="237" width="62" height="14" rx="7" fill="#2f69a8"/><text x="265" y="247.5">プライベート</text>
    <rect x="248" y="331" width="34" height="14" rx="7" fill="#5a6673"/><text x="265" y="341.5">分離</text>
  </g>

  <!-- 線: 通信（実線の矢印） -->
  <g fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)">
    <!-- 1: インターネット ⇔ IGW、IGW → ALB -->
    <path d="M180,44 V70" marker-start="url(#arrow)"/>
    <path d="M180,108 V136 H129 V166"/>
    <path d="M180,136 H231 V166"/>
    <!-- 2: ALB → アプリ -->
    <path d="M129,210 V260"/>
    <path d="M231,210 V260"/>
    <!-- 3: アプリ → プライマリ -->
    <path d="M121,304 V354"/>
    <path d="M231,304 V326 H145 V354"/>
    <!-- 4: アプリ → NAT → IGW -->
    <path d="M98,282 H61 V210"/>
    <path d="M61,166 V116 H170 V108"/>
    <path d="M262,282 H299 V210"/>
    <path d="M299,166 V116 H190 V108"/>
  </g>

  <!-- 線: データの複製（二重線の矢印） -->
  <path d="M160,376 H194" fill="none" stroke="#1f2933" stroke-width="4.5"/>
  <path d="M160,376 H194" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <path d="M192,371 L200,376 L192,381 z" fill="#1f2933"/>

  <!-- 部品 -->
  <g text-anchor="middle">
    <g>
      <rect x="80" y="8" width="200" height="36" rx="6" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/>
      <text x="180" y="23" font-size="11" font-weight="700" fill="#1f2933">インターネット</text>
      <text x="180" y="37" font-size="10" fill="#52606d">利用者・外部のサイト</text>
    </g>
    <g>
      <rect x="148" y="70" width="64" height="38" rx="6" fill="#ffffff" stroke="#6b4fbb" stroke-width="1.5"/>
      <rect x="148" y="70" width="64" height="5" rx="2" fill="#6b4fbb"/>
      <text x="180" y="89" font-size="11" font-weight="700" fill="#1f2933">IGW</text>
      <text x="180" y="102" font-size="10" fill="#52606d">出入り口</text>
    </g>

    <!-- AZ-a -->
    <g>
      <rect x="30" y="166" width="62" height="44" rx="6" fill="#ffffff" stroke="#6b4fbb" stroke-width="1.5"/>
      <rect x="30" y="166" width="62" height="5" rx="2" fill="#6b4fbb"/>
      <text x="61" y="187" font-size="11" font-weight="700" fill="#1f2933">NAT</text>
      <text x="61" y="201" font-size="10" fill="#52606d">外へ出る</text>
    </g>
    <g>
      <rect x="98" y="166" width="62" height="44" rx="6" fill="#ffffff" stroke="#6b4fbb" stroke-width="1.5"/>
      <rect x="98" y="166" width="62" height="5" rx="2" fill="#6b4fbb"/>
      <text x="129" y="187" font-size="11" font-weight="700" fill="#1f2933">ELB</text>
      <text x="129" y="201" font-size="10" fill="#52606d">ALB</text>
    </g>
    <g>
      <rect x="98" y="260" width="62" height="44" rx="6" fill="#ffffff" stroke="#c2571a" stroke-width="1.5"/>
      <rect x="98" y="260" width="62" height="5" rx="2" fill="#c2571a"/>
      <text x="129" y="281" font-size="11" font-weight="700" fill="#1f2933">EC2</text>
      <text x="129" y="295" font-size="10" fill="#52606d">アプリ</text>
    </g>
    <g>
      <rect x="98" y="354" width="62" height="44" rx="6" fill="#ffffff" stroke="#2a5fb0" stroke-width="1.5"/>
      <rect x="98" y="354" width="62" height="5" rx="2" fill="#2a5fb0"/>
      <text x="129" y="375" font-size="11" font-weight="700" fill="#1f2933">RDS</text>
      <text x="129" y="389" font-size="10" fill="#52606d">プライマリ</text>
    </g>

    <!-- AZ-c -->
    <g>
      <rect x="200" y="166" width="62" height="44" rx="6" fill="#ffffff" stroke="#6b4fbb" stroke-width="1.5"/>
      <rect x="200" y="166" width="62" height="5" rx="2" fill="#6b4fbb"/>
      <text x="231" y="187" font-size="11" font-weight="700" fill="#1f2933">ELB</text>
      <text x="231" y="201" font-size="10" fill="#52606d">ALB</text>
    </g>
    <g>
      <rect x="268" y="166" width="62" height="44" rx="6" fill="#ffffff" stroke="#6b4fbb" stroke-width="1.5"/>
      <rect x="268" y="166" width="62" height="5" rx="2" fill="#6b4fbb"/>
      <text x="299" y="187" font-size="11" font-weight="700" fill="#1f2933">NAT</text>
      <text x="299" y="201" font-size="10" fill="#52606d">外へ出る</text>
    </g>
    <g>
      <rect x="200" y="260" width="62" height="44" rx="6" fill="#ffffff" stroke="#c2571a" stroke-width="1.5"/>
      <rect x="200" y="260" width="62" height="5" rx="2" fill="#c2571a"/>
      <text x="231" y="281" font-size="11" font-weight="700" fill="#1f2933">EC2</text>
      <text x="231" y="295" font-size="10" fill="#52606d">アプリ</text>
    </g>
    <g>
      <rect x="200" y="354" width="62" height="44" rx="6" fill="#ffffff" stroke="#2a5fb0" stroke-width="1.5"/>
      <rect x="200" y="354" width="62" height="5" rx="2" fill="#2a5fb0"/>
      <text x="231" y="375" font-size="11" font-weight="700" fill="#1f2933">RDS</text>
      <text x="231" y="389" font-size="10" fill="#52606d">スタンバイ</text>
    </g>
  </g>

  <!-- 段階の番号 -->
  <g text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">
    <circle cx="196" cy="57" r="8" fill="#1f2933"/><text x="196" y="60.8">1</text>
    <circle cx="143" cy="232" r="8" fill="#1f2933"/><text x="143" y="235.8">2</text>
    <circle cx="180" cy="326" r="8" fill="#1f2933"/><text x="180" y="329.8">3</text>
    <circle cx="47" cy="234" r="8" fill="#1f2933"/><text x="47" y="237.8">4</text>
    <circle cx="180" cy="360" r="8" fill="#1f2933"/><text x="180" y="363.8">5</text>
  </g>

  <!-- 段階の説明（アプリでは図の下に 1 段ずつ出す） -->
  <g font-size="11" fill="#1f2933">
    <text x="10" y="454">1　リクエストが IGW から ALB に届く</text>
    <text x="10" y="471">2　ALB がアプリへ振り分ける</text>
    <text x="10" y="488">3　アプリがプライマリに読み書きする</text>
    <text x="10" y="505">4　アプリは NAT と IGW を通って外へ出る（外からは入れない）</text>
    <text x="10" y="522">5　プライマリからスタンバイへ同期で複製する</text>
  </g>
  <g font-size="10" fill="#52606d">
    <path d="M10,537 H30" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="36" y="540.5">通信</text>
    <path d="M70,537 H88" fill="none" stroke="#1f2933" stroke-width="4.5"/>
    <path d="M70,537 H88" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M86,532 L94,537 L86,542 z" fill="#1f2933"/>
    <text x="100" y="540.5">データの複製</text>
  </g>
</svg>
